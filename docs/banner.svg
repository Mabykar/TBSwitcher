<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="TBSwitcher: a lightning bolt in the menu bar toggles Intel Turbo Boost">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#2b2b30"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb340"/>
      <stop offset="1" stop-color="#ff453a"/>
    </linearGradient>
  </defs>

  <rect width="900" height="320" rx="24" fill="url(#bg)"/>

  <!-- app icon -->
  <g transform="translate(60 80)">
    <rect width="160" height="160" rx="36" fill="url(#icon)"/>
    <path transform="translate(30 30)" fill="#ffffff" d="M58 4 L20 56 H44 L36 96 L82 40 H56 L68 4 Z"/>
  </g>

  <!-- title -->
  <text x="260" y="130" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" fill="#ffffff">TBSwitcher</text>
  <text x="262" y="172" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#a1a1a6">One click in the menu bar. Turbo Boost off. No password prompts.</text>

  <!-- menu bar mock-up -->
  <g transform="translate(262 204)">
    <rect width="560" height="44" rx="12" fill="#3a3a3c"/>

    <g transform="translate(16 8) scale(0.28)">
      <path fill="#ffffff" d="M58 4 L20 56 H44 L36 96 L82 40 H56 L68 4 Z"/>
    </g>
    <text x="52" y="28" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d1d1d6">Turbo Boost ON</text>

    <g transform="translate(296 8) scale(0.28)">
      <path fill="#ffffff" d="M58 4 L20 56 H44 L36 96 L82 40 H56 L68 4 Z"/>
      <line x1="6" y1="94" x2="94" y2="6" stroke="#3a3a3c" stroke-width="18" stroke-linecap="round"/>
      <line x1="6" y1="94" x2="94" y2="6" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    </g>
    <text x="332" y="28" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d1d1d6">Turbo Boost OFF</text>
  </g>

  <text x="262" y="282" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8e8e93">Left-click: toggle   ·   Right-click: menu</text>
</svg>
